<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WPT Marketing Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand"><b>WPT Marketing Hub</b><span>West Pier Technologies</span></div>
    <nav class="nav" id="nav" aria-label="Hub pages"></nav>
    <div class="rail-foot">
      <span id="version-tag"></span>
      <button type="button" id="theme-toggle">Switch theme</button>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="assets/app.js"></script>
</body>
</html>
